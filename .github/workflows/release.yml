name: Release GRID

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (for example v0.2.11)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.asset }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            asset: grid-darwin-x86_64
            binary: grid
            target: x86_64-apple-darwin
          - os: macos-14
            asset: grid-darwin-aarch64
            binary: grid
            target: ""
          - os: ubuntu-24.04
            asset: grid-linux-x86_64
            binary: grid
            target: ""
          - os: windows-2022
            asset: grid-windows-x86_64.exe
            binary: grid.exe
            target: ""
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install cross-compilation target
        if: matrix.target != ''
        run: rustup target add "${{ matrix.target }}"
      - name: Install Windows OpenSSL build dependency
        if: runner.os == 'Windows'
        shell: pwsh
        run: choco install strawberryperl --no-progress --yes
      - name: Build release binary
        run: |
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            export PATH="/c/Strawberry/perl/bin:$PATH"
            export PERL="/c/Strawberry/perl/bin/perl.exe"
            "$PERL" -MLocale::Maketext::Simple -e 1
          fi
          if [[ -n "${{ matrix.target }}" ]]; then
            cargo build --release --locked --target "${{ matrix.target }}"
          else
            cargo build --release --locked
          fi
      - run: |
          mkdir -p dist
          binary_path="target/release/${{ matrix.binary }}"
          if [[ -n "${{ matrix.target }}" ]]; then
            binary_path="target/${{ matrix.target }}/release/${{ matrix.binary }}"
          fi
          cp "$binary_path" "dist/${{ matrix.asset }}"
          if [[ "${{ runner.os }}" != "Windows" ]]; then chmod 755 "dist/${{ matrix.asset }}"; fi
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Publish pre-alpha release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          target_commitish: ${{ github.sha }}
          prerelease: true
          generate_release_notes: true
          files: release-assets/*
