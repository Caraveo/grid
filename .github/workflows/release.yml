name: Release GRID

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (for example v0.2.11)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.asset }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-13
            asset: grid-darwin-x86_64
            binary: grid
          - os: macos-14
            asset: grid-darwin-aarch64
            binary: grid
          - os: ubuntu-24.04
            asset: grid-linux-x86_64
            binary: grid
          - os: windows-2022
            asset: grid-windows-x86_64.exe
            binary: grid.exe
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Windows OpenSSL build dependency
        if: runner.os == 'Windows'
        shell: pwsh
        run: choco install strawberryperl --no-progress --yes
      - name: Build release binary
        run: |
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            export PATH="C:/Strawberry/perl/bin:$PATH"
          fi
          cargo build --release --locked
      - run: |
          mkdir -p dist
          cp "target/release/${{ matrix.binary }}" "dist/${{ matrix.asset }}"
          if [[ "${{ runner.os }}" != "Windows" ]]; then chmod 755 "dist/${{ matrix.asset }}"; fi
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Publish pre-alpha release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          target_commitish: ${{ github.sha }}
          prerelease: true
          generate_release_notes: true
          files: release-assets/*
