[package]
name = "grid"
version = "0.2.15"
edition = "2021"
authors = ["GRID Contributors"]
description = "GRID Phase 1 — useful mining CLI (Bitcoin TSL, PoR earn)"
repository = "https://github.com/Caraveo/grid"
license = "MIT"
readme = "README.md"

[[bin]]
name = "grid"
path = "src/main.rs"

[lib]
name = "grid"
path = "src/lib.rs"

[dependencies]
tokio = { version = "1.40", features = ["full"] }
axum = "0.7"
tower-http = { version = "0.5", features = ["cors"] }
clap = { version = "4.5", features = ["derive", "env"] }
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
uuid = { version = "1.10", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
sysinfo = "0.30"
blake3 = "1.5"
sha2 = "0.10"
hex = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
dirs = "5.0"
parking_lot = "0.12"
ed25519-dalek = { version = "2.1", features = ["rand_core"] }
rand = "0.8"
aes-gcm = "0.10"
rpassword = "7"
url = "2"
zeroize = { version = "1", features = ["derive"] }
bip39 = "2"
webauthn-rs = { version = "0.5", default-features = true, features = [
  "danger-allow-state-serialisation",
] }
# Vendored OpenSSL so cross-builds (darwin-aarch64, linux) don't need a host sysroot.
# Pulled transitively by webauthn-rs; explicit feature forces static openssl.
openssl = { version = "0.10", features = ["vendored"] }
snow = "0.9"

[dev-dependencies]
tempfile = "3.10"

[profile.release]
opt-level = 3
# ThinLTO keeps production whole-program optimization while allowing native
# macOS, Linux, and Windows release builds to complete reliably in CI.
lto = "thin"
codegen-units = 1
strip = true
