[package]
name = "grid"
version = "0.1.0"
edition = "2021"
authors = ["GRID Contributors"]
description = "GRID Phase 1 — useful mining CLI (Bitcoin TSL, PoR earn)"
repository = "https://github.com/Caraveo/grid"
license = "MIT"
readme = "README.md"

[[bin]]
name = "grid"
path = "src/main.rs"

[lib]
name = "grid"
path = "src/lib.rs"

[dependencies]
tokio = { version = "1.40", features = ["full"] }
axum = "0.7"
tower-http = { version = "0.5", features = ["cors"] }
clap = { version = "4.5", features = ["derive", "env"] }
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
uuid = { version = "1.10", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
sysinfo = "0.30"
blake3 = "1.5"
sha2 = "0.10"
hex = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
dirs = "5.0"
parking_lot = "0.12"

[dev-dependencies]
tempfile = "3.10"
tokio-test = "0.4"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
