# Arc secure wallet API.
# DNS: arc.grid-compute.com -> Genesis edge/load balancer
# TLS is terminated by the deployment's existing certificate automation.

limit_req_zone $binary_remote_addr zone=arc_reads:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=arc_writes:10m rate=3r/s;

server {
    listen 80;
    server_name arc.grid-compute.com;

    # The browser wallet is served only from this exact origin. Native apps do
    # not use CORS, while unapproved browser origins receive no allow header.
    add_header Access-Control-Allow-Origin "https://grid-compute.com" always;
    add_header Vary "Origin" always;
    add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
    add_header Access-Control-Allow-Headers "Content-Type" always;

    if ($request_method = OPTIONS) {
        return 204;
    }

    location = /health {
        limit_req zone=arc_reads burst=20 nodelay;
        proxy_pass http://127.0.0.1:9100;
        include proxy_params;
    }

    location = /v1/chain {
        limit_req zone=arc_reads burst=20 nodelay;
        proxy_pass http://127.0.0.1:9100;
        include proxy_params;
    }

    location ~ ^/v1/wallet/ {
        limit_req zone=arc_reads burst=20 nodelay;
        proxy_pass http://127.0.0.1:9100;
        include proxy_params;
    }

    location = /v1/transactions {
        limit_req zone=arc_writes burst=3 nodelay;
        limit_except POST { deny all; }
        client_max_body_size 16k;
        proxy_pass http://127.0.0.1:9100;
        include proxy_params;
    }

    location / {
        return 404;
    }
}
