[package]
name = "grid-wallet-desktop"
version = "0.1.2"
description = "Official GRID wallet for Windows and Linux"
authors = ["GRID Contributors"]
edition = "2021"
license = "MIT"

[lib]
name = "grid_wallet_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
grid = { path = "../../.." }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
